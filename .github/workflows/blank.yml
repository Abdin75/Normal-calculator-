name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build every project zip
        run: |
          mkdir -p src out
          for z in *.zip; do
            n="${z%.zip}"
            unzip -q "$z" -d "src/$n"
            if [ -f "src/$n/$n/settings.gradle" ]; then
              gradle --no-daemon -p "src/$n/$n" assembleDebug
              cp "src/$n/$n/app/build/outputs/apk/debug/app-debug.apk" "out/$n.apk"
            else
              echo "Skipping $z (not an Android project)"
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: out/*.apk
